<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting… · BitTokens</title>
  <link rel="canonical" href="https://kreitnerl.github.io/BitTokens/">
  <script>
    (function () {
      var path = location.pathname;
      var lower = path.toLowerCase();
      var canonical = '/BitTokens';
      var suffix = location.search + location.hash;
      var target = null;

      if (lower === '/bittokens' || lower === '/bittokens/') {
        if (path !== '/BitTokens' && path !== '/BitTokens/') {
          target = canonical + '/' + suffix;
        }
      } else if (lower.indexOf('/bittokens/') === 0 && path.indexOf('/BitTokens/') !== 0) {
        target = canonical + path.slice('/bittokens/'.length) + suffix;
      }

      if (target) {
        location.replace(target);
        return;
      }

      location.replace(canonical + '/' + suffix);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://kreitnerl.github.io/BitTokens/">BitTokens</a>…</p>
</body>
</html>
